<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Story La Zenosphère × Slotime</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{--cream:#F7F2E8;--sage:#8E9A5B;--sage-d:#5E6A36;--ink:#2B2620;--muted:#6E665A;--terra:#9A3A22;--line:#E4DCCB}
html,body{margin:0;background:#111}
.p{position:relative;width:720px;height:1280px;overflow:hidden;background:var(--cream);color:var(--ink);font-family:Jost,system-ui,sans-serif}
.ph{position:absolute;left:0;top:0;width:720px;height:570px;object-fit:cover;object-position:62% 55%}
.fade{position:absolute;left:0;right:0;top:350px;height:230px;background:linear-gradient(180deg,rgba(247,242,232,0) 0%,var(--cream) 92%)}
.top{position:absolute;left:0;right:0;top:110px;display:flex;justify-content:center}
.pill{font:600 15px Jost;letter-spacing:.36em;text-transform:uppercase;padding:10px 20px 10px 26px;border-radius:999px;background:rgba(247,242,232,.94);color:var(--terra)}
.logo{position:absolute;left:50%;top:390px;width:210px;height:210px;margin-left:-105px;overflow:hidden;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 20px 50px -18px rgba(60,30,10,.45)}
.logo img{width:136px;height:auto}
.body{position:absolute;left:52px;right:52px;top:620px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
h1{margin:0;font:500 50px/1.05 Jost;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--sage-d)}
.sub{margin:0;font:400 20px/1.4 Jost;color:var(--muted)}
.list{width:100%;margin-top:4px;border-radius:22px;background:#fff;box-shadow:0 18px 40px -26px rgba(60,30,10,.35);padding:6px 22px;box-sizing:border-box}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.row b{font:500 20px Jost}
.row span{font:400 15px Jost;color:var(--muted);margin-left:8px}
.row i{font:600 19px Inter;font-style:normal;color:var(--terra);white-space:nowrap}
.cta{margin-top:6px;display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 30px;border-radius:999px;background:var(--sage-d);color:#fff;font:500 20px Jost;letter-spacing:.04em}
.cta svg{width:18px;height:18px}
.info{font:400 16px/1.45 Jost;color:var(--muted)}
.info b{display:block;font:600 22px Inter;color:var(--ink);margin-top:2px}
.with{margin-top:4px;display:flex;justify-content:center;align-items:center;gap:9px;font:500 13px Jost;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.with i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#324E80,#1E2B44);color:#fff;display:grid;place-items:center;font:700 14px Inter;font-style:normal}
.with b{font:800 19px Inter;letter-spacing:-.02em;text-transform:none;color:var(--ink)}
</style></head><body>
